<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS software stack on Cortex-M</title>
  <desc id="desc">Layered relationship from Cortex-M hardware through exceptions and FreeRTOS kernel services to embedded tasks.</desc>
  <rect width="960" height="500" fill="#10161d" rx="18"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="480" y="48" fill="#d8e2ec" font-size="24" font-weight="600">Cortex-M → FreeRTOS → Embedded Application</text>
    <g stroke="#3d5368" stroke-width="2">
      <rect x="120" y="80" width="720" height="70" rx="10" fill="#263746"/>
      <rect x="120" y="175" width="720" height="70" rx="10" fill="#203240"/>
      <rect x="120" y="270" width="720" height="70" rx="10" fill="#1b2c38"/>
      <rect x="120" y="365" width="720" height="70" rx="10" fill="#172630"/>
    </g>
    <g fill="#e4edf5" font-size="20" font-weight="600">
      <text x="480" y="111">Embedded Application</text>
      <text x="480" y="206">FreeRTOS Services</text>
      <text x="480" y="301">Kernel and Cortex-M Port</text>
      <text x="480" y="396">Cortex-M4 Hardware</text>
    </g>
    <g fill="#9fb6c9" font-size="15">
      <text x="480" y="135">Tasks · Drivers · Application State</text>
      <text x="480" y="230">Queue · Semaphore · Mutex · Event Group · Timer · Notification</text>
      <text x="480" y="325">Scheduler · Tick · Context Switch · heap_4</text>
      <text x="480" y="420">SysTick · PendSV · SVC · NVIC</text>
    </g>
    <g stroke="#5fa8d3" stroke-width="3" fill="none">
      <path d="M480 150v25"/><path d="M480 245v25"/><path d="M480 340v25"/>
    </g>
    <g fill="#5fa8d3"><path d="M473 168l7 10 7-10z"/><path d="M473 263l7 10 7-10z"/><path d="M473 358l7 10 7-10z"/></g>
  </g>
</svg>


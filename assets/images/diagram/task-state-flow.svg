<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS task states and scheduler transitions</title>
  <desc id="desc">Ready, running, blocked and suspended task states connected by scheduling, preemption, delay, event, suspend and resume transitions.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke: #52606d; stroke-width: 2; }
    .title { fill: #1f2328; font: 600 22px 'Segoe UI', Arial, sans-serif; }
    .label { fill: #1f2328; font: 600 19px 'Segoe UI', Arial, sans-serif; }
    .detail { fill: #57606a; font: 13px 'Segoe UI', Arial, sans-serif; }
    .line { stroke: #0969da; stroke-width: 3; fill: none; }
    .arrow { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .title, .label { fill: #f0f6fc; }
      .detail { fill: #b1bac4; }
      .line { stroke: #58a6ff; }
      .arrow { fill: #58a6ff; }
    }
  </style>
  <rect class="bg" width="1000" height="500" rx="18"/>
  <g text-anchor="middle">
    <text class="title" x="500" y="46">Task State and Scheduler Flow</text>
    <g class="box">
      <rect x="80" y="180" width="180" height="76" rx="11"/>
      <rect x="410" y="180" width="180" height="76" rx="11"/>
      <rect x="740" y="80" width="180" height="76" rx="11"/>
      <rect x="740" y="300" width="180" height="76" rx="11"/>
    </g>
    <g class="label">
      <text x="170" y="225">Ready</text><text x="500" y="225">Running</text>
      <text x="830" y="125">Blocked</text><text x="830" y="345">Suspended</text>
    </g>
    <g class="line">
      <path d="M260 202h142"/><path d="M410 242H268"/>
      <path d="M590 196L732 135"/><path d="M740 143H675V105H170V174"/>
      <path d="M590 240l142 77"/><path d="M740 331H675V390H170V264"/>
    </g>
    <g class="arrow">
      <path d="M396 195l10 7-10 7z"/><path d="M274 235l-10 7 10 7z"/>
      <path d="M724 131l11 1-6 9z"/><path d="M163 168l7 10 7-10z"/>
      <path d="M723 310l11 4-8 7z"/><path d="M163 272l7-10 7 10z"/>
    </g>
    <g class="detail">
      <text x="335" y="188">schedule</text><text x="337" y="270">preempt / yield</text>
      <text x="660" y="140">delay / wait</text><text x="430" y="94">timeout / event → Ready</text>
      <text x="670" y="283">suspend</text><text x="430" y="382">resume → Ready</text>
      <text x="500" y="435">Tick updates time; priority and wakeup events determine the next Ready task.</text>
  <text x="500" y="458">State transitions represented by the retained task-management projects.</text>
    </g>
  </g>
</svg>

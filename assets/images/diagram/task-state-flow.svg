<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">FreeRTOS task state flow</title>
  <desc id="desc">Simplified transitions among ready, running, blocked and suspended task states.</desc>
  <rect width="900" height="430" fill="#10161d" rx="18"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="450" y="45" fill="#d8e2ec" font-size="24" font-weight="600">Task State Flow</text>
    <g fill="#243746" stroke="#526a7d" stroke-width="2">
      <rect x="90" y="155" width="160" height="70" rx="12"/>
      <rect x="370" y="155" width="160" height="70" rx="12"/>
      <rect x="650" y="70" width="160" height="70" rx="12"/>
      <rect x="650" y="255" width="160" height="70" rx="12"/>
    </g>
    <g fill="#e6edf3" font-size="20" font-weight="600">
      <text x="170" y="198">Ready</text><text x="450" y="198">Running</text>
      <text x="730" y="113">Blocked</text><text x="730" y="298">Suspended</text>
    </g>
    <g stroke="#5fa8d3" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5fa8d3"/></marker></defs>
      <path d="M250 175h112"/><path d="M370 215H258"/><path d="M530 172L642 120"/>
      <path d="M650 126L535 177"/><path d="M530 212L642 275"/><path d="M650 287L535 218"/>
    </g>
    <g fill="#9fb6c9" font-size="13">
      <text x="308" y="162">schedule</text><text x="310" y="239">preempt / yield</text>
      <text x="590" y="124">delay / wait</text><text x="590" y="154">timeout / event</text>
      <text x="600" y="245">suspend</text><text x="600" y="314">resume</text>
    </g>
    <text x="450" y="385" fill="#8197a8" font-size="14">Simplified mechanism map; not a runtime trace.</text>
  </g>
</svg>


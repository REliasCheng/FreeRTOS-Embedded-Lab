<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">ISR-to-task paths preserved in the repository</title>
  <desc id="desc">Peripheral interrupts use task resume, semaphore, queue, or timer FromISR APIs; a higher-priority task may request a context switch.</desc>
  <style>
    .bg { fill: #f6f8fa; }
    .box { fill: #ffffff; stroke: #52606d; stroke-width: 2; }
    .title { fill: #1f2328; font: 600 22px 'Segoe UI', Arial, sans-serif; }
    .label { fill: #1f2328; font: 600 17px 'Segoe UI', Arial, sans-serif; }
    .detail { fill: #57606a; font: 14px 'Segoe UI', Arial, sans-serif; }
    .line { stroke: #0969da; stroke-width: 3; fill: none; }
    .arrow { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .title, .label { fill: #f0f6fc; }
      .detail { fill: #b1bac4; }
      .line { stroke: #58a6ff; }
      .arrow { fill: #58a6ff; }
    }
  </style>
  <rect class="bg" width="1100" height="500" rx="18"/>
  <g text-anchor="middle">
    <text class="title" x="550" y="42">ISR-to-Task Collaboration</text>
    <g class="box">
      <rect x="430" y="70" width="240" height="72" rx="10"/>
      <rect x="430" y="180" width="240" height="72" rx="10"/>
      <rect x="55" y="310" width="220" height="76" rx="10"/>
      <rect x="315" y="310" width="220" height="76" rx="10"/>
      <rect x="575" y="310" width="220" height="76" rx="10"/>
      <rect x="835" y="310" width="210" height="76" rx="10"/>
      <rect x="430" y="420" width="240" height="58" rx="10"/>
    </g>
    <text class="label" x="550" y="101">Peripheral Event</text>
    <text class="detail" x="550" y="124">Key · Timer · UART</text>
    <text class="label" x="550" y="211">ISR</text>
    <text class="detail" x="550" y="234">acknowledge event, submit minimal work</text>
    <text class="label" x="165" y="341">Task Resume</text>
    <text class="detail" x="165" y="365">xTaskResumeFromISR</text>
    <text class="label" x="425" y="341">Semaphore</text>
    <text class="detail" x="425" y="365">xSemaphoreGiveFromISR</text>
    <text class="label" x="685" y="341">Queue</text>
    <text class="detail" x="685" y="365">xQueueSendFromISR</text>
    <text class="label" x="940" y="334">Timer Command</text>
    <text class="detail" x="940" y="357">xTimerStartFromISR</text>
    <text class="detail" x="940" y="376">xTimerStopFromISR</text>
    <text class="label" x="550" y="447">Task Ready → Scheduler Decision</text>
    <text class="detail" x="550" y="467">optional portYIELD_FROM_ISR when a higher-priority task is woken</text>
    <g class="line">
      <path d="M550 142v34"/><path d="M550 252v25H165v29"/><path d="M550 277H425v29"/>
      <path d="M550 277H685v29"/><path d="M550 277H940v29"/>
      <path d="M165 386v18h385v12"/><path d="M425 386v18"/><path d="M685 386v18H550"/><path d="M940 386v18H550"/>
    </g>
    <g class="arrow">
      <path d="M543 170l7 10 7-10z"/><path d="M158 300l7 10 7-10z"/><path d="M418 300l7 10 7-10z"/>
      <path d="M678 300l7 10 7-10z"/><path d="M933 300l7 10 7-10z"/><path d="M543 410l7 10 7-10z"/>
    </g>
  </g>
</svg>
